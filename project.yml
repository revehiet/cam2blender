name: ARKitCameraSender
options:
  bundleIdPrefix: com.arkitcam
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  ARKitCameraSender:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ios/ARKitCameraSender
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arkitcam.ARKitCameraSender
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: ios/Info.plist
schemes:
  ARKitCameraSender:
    build:
      targets:
        ARKitCameraSender: all
    run:
      config: Debug
